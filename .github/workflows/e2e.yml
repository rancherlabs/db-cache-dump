name: End-to-end tests
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./package
          load: true
          tags: ghcr.io/${{ github.repository }}:ci

      - name: Smoke test
        run: bash test/smoke.sh ghcr.io/${{ github.repository }}:ci

      - name: Run e2e
        run: IMAGE=ghcr.io/${{ github.repository }}:ci bash test/e2e-k3d.sh
