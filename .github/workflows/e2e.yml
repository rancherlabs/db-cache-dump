name: Build and test
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./package
          load: true
          tags: ghcr.io/${{ github.repository }}:ci

      - name: Smoke test
        run: bash test/smoke.sh ghcr.io/${{ github.repository }}:ci

      - name: Install k3d
        # renovate: datasource=github-releases depName=k3d-io/k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash

      - name: Run e2e
        run: IMAGE=ghcr.io/${{ github.repository }}:ci bash test/e2e-k3d.sh
