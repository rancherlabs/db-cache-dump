name: Build and test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./package
          load: true
          tags: ghcr.io/${{ github.repository }}:ci

      - name: Smoke test
        run: bash test/smoke.sh ghcr.io/${{ github.repository }}:ci

      - name: Install k3d
        # renovate: datasource=github-releases depName=k3d-io/k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.9.0 bash

      - name: Run e2e
        run: IMAGE=ghcr.io/${{ github.repository }}:ci bash test/e2e-k3d.sh
